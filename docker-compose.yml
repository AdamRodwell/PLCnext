services:
  dev:
    image: ghcr.io/adamrodwell/plc-next-ghcr:2024
    container_name: plcnext-dev
    volumes:
      - .:/workspace:cached
      - ~/.claude:/home/plc/.claude
      - ${PLCNEXT_LIBRARIES_PATH}:/home/plc/Windows_PLCNextEngineer_Libraries
    command: sleep infinity
    environment:
      - SHELL=/bin/zsh
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
